# 旧版小板配置：有效棋盘区域 105×75 mm，15 mm 格；/** 选择器使参数适用于相应检测/标定节点。
/**:
  ros__parameters:
    # 横向/纵向是格子数，不是内角点数；角点坐标由 Board 根据格数生成。
    squares_x: 7
    squares_y: 5
    # 格长和标记边长均为米，必须与实测打印尺寸一致；不可只按屏幕像素估算。
    square_m: 0.015
    marker_m: 0.011
    # 字典必须与打印图案一致；同一字典中标记 ID 才有相同含义。
    dictionary: DICT_4X4_50
